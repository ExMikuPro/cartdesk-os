interfaces:
  xhgc_cartridge:
    status: experimental_optional
    required_for_boot: false
    required_for_normal_os_operation: false
    fallback_paths: [SD, QSPI, eMMC]
    preferred_scheme: C
    alternative_scheme: B
    width_v1: 8
    width_v2: 16
    little_endian: true
    v1_required_signals:
      - XHGC_D0
      - XHGC_D1
      - XHGC_D2
      - XHGC_D3
      - XHGC_D4
      - XHGC_D5
      - XHGC_D6
      - XHGC_D7
      - XHGC_I2C_SCL
      - XHGC_I2C_SDA
      - XHGC_RD_CLK
      - XHGC_READY
      - XHGC_RESET_N
      - XHGC_CART_DET
    v1_optional_or_reserved_signals:
      - XHGC_D8
      - XHGC_D9
      - XHGC_D10
      - XHGC_D11
      - XHGC_D12
      - XHGC_D13
      - XHGC_D14
      - XHGC_D15
      - XHGC_CS_N
      - XHGC_IRQ_N
      - XHGC_WR_N
      - XHGC_MODE0
      - XHGC_MODE1
    gpio_pressure_drop_order:
      - XHGC_WR_N
      - XHGC_IRQ_N
      - XHGC_MODE0
      - XHGC_MODE1
      - XHGC_D8
      - XHGC_D9
      - XHGC_D10
      - XHGC_D11
      - XHGC_D12
      - XHGC_D13
      - XHGC_D14
      - XHGC_D15
    rejected_schemes:
      - name: A
        reason: uses PA11 and PA12, which conflict with USB FS
    signals:
