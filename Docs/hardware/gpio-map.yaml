reservations:
  - signal: USB_OTG_FS_DM
    pin: PA11
    port: GPIOA
    bit: 11
    reason: USB FS MUST be preserved
  - signal: USB_OTG_FS_DP
    pin: PA12
    port: GPIOA
    bit: 12
    reason: USB FS MUST be preserved
  - signal: SWDIO
    pin: PA13
    port: GPIOA
    bit: 13
    reason: 2-wire SWD debug
  - signal: SWCLK
    pin: PA14
    port: GPIOA
    bit: 14
    reason: 2-wire SWD debug
  - signal: RCC_OSC_IN
    pin: PH0
    port: GPIOH
    bit: 0
    reason: HSE crystal input
  - signal: RCC_OSC_OUT
    pin: PH1
    port: GPIOH
    bit: 1
    reason: HSE crystal output

